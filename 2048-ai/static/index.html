<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 AI - 魔幻飲料店專用</title>

    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            background-color: #222; 
        }
        
        .phone-screen {
            position: relative;
            width: 100vw;
            max-width: 450px; 
            height: 100vh;
            min-height: 850px;
            background-image: url('image_2.png');
            background-size: cover;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 👉 新增：在中間擋住原本遊戲圖片文字的遮罩 (你可以微調 top 和 height 來對準那行字) */
        .text-cover {
            position: absolute;
            top: 500px; /* 遮罩位置 */
            width: 88%;
            height: 50px; /* 遮罩高度 */
            background-color: #532222; /* 配合背景底色遮蓋，或改為 transparent */
            z-index: 5;
            pointer-events: none; /* 讓滑鼠可以穿透遮罩直接點擊後方的格子 */
            opacity: 0.8; /* 調整透明度讓它融進背景 */
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 2px; 
            width: 88%; 
            background-color: transparent; 
            margin-top: 260px; 
            z-index: 10; /* 確保格子在遮罩上方 */
        }

        .grid input { 
            aspect-ratio: 1 / 1; 
            width: 100%;
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            border: none; 
            background-color: transparent; /* 保持全透明，露出底圖 */
            color: #fff; 
            text-shadow: 1px 1px 2px black; 
            background-size: cover; 
            background-position: center;
            cursor: pointer; /* 游標變成手指，提示可以點擊 */
        }
        
        .grid input:focus { outline: 2px solid #ffcc00; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield; 
        }
        
        .controls {
            margin-top: auto; 
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }
        button { 
            padding: 12px 30px; 
            font-size: 20px; 
            cursor: pointer; 
            background-color: #d15a5a; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 25px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #b04848; }
        #result { margin-top: 15px; font-size: 28px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>
    <div class="phone-screen">
        <!-- 遮住背景原本文字的區塊 -->
        <div class="text-cover"></div>

        <div class="grid" id="board">
            <script>
                function updateImage(inputElement) {
                    let val = parseInt(inputElement.value) || 0;
                    if (val > 0) {
                        inputElement.style.backgroundImage = `url('images/${val}.png')`;
                        inputElement.style.color = "transparent"; 
                        inputElement.style.textShadow = "none"; 
                    } else {
                        inputElement.style.backgroundImage = "none";
                        inputElement.style.color = "#fff"; 
                        inputElement.style.textShadow = "1px 1px 2px black"; 
                    }
                }

                // 產生 16 個格子，並加入點擊自動加 1 的功能 (0 -> 1 -> 2 ... -> 11 -> 0)
                for(let i=0; i<16; i++) {
                    document.write(`<input type="number" id="cell-${i}" value="0" min="0" max="11" step="1" oninput="updateImage(this)" onclick="incrementCell(this)">`);
                }

                function incrementCell(inputElement) {
                    let currentVal = parseInt(inputElement.value) || 0;
                    currentVal = (currentVal + 1) % 12; // 0 到 11 循環，超過 11 變回 0
                    inputElement.value = currentVal;
                    updateImage(inputElement);
                }
            </script>
        </div>

        <div class="controls">
            <button onclick="askAI()">請求 AI 最佳解</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        async function askAI() {
            document.getElementById("result").innerText = "計算中...";
            
            let boardArray = [];
            for (let r = 0; r < 4; r++) {
                let row = [];
                for (let c = 0; c < 4; c++) {
                    let power = parseInt(document.getElementById(`cell-${r*4+c}`).value) || 0;
                    let realValue = (power === 0) ? 0 : Math.pow(2, power);
                    row.push(realValue);
                }
                boardArray.push(row);
            }

            try {
                const response = await fetch("/api/get_best_move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ board: boardArray })
                });
                
                const data = await response.json();
                if(data.error) {
                    document.getElementById("result").innerText = "錯誤: " + data.error;
                } else {
                    document.getElementById("result").innerText = "👉 " + data.best_move;
                }
            } catch (error) {
                document.getElementById("result").innerText = "連線失敗";
            }
        }
    </script>
</body>
</html>
