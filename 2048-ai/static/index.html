<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 AI - 魔幻飲料店專用</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            background-color: #222; 
        }
        
        .phone-screen {
            position: relative;
            width: 100vw;
            max-width: 450px; 
            height: 100vh;
            min-height: 850px;
            background-image: url('image_2.png');
            background-size: cover;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .custom-title {
            position: absolute;
            top: 125px;     
            right: 0px;     
            width: 280px;   
            height: 50px;   
            background-color: #2b2537; 
            color: #ffe6a0; 
            font-size: 22px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px 0 0 8px; 
            z-index: 20;
            letter-spacing: 1px;
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.5); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 2px; 
            width: 86%; 
            background-color: #4c2222; 
            padding: 4px; 
            border-radius: 6px; 
            margin-top: 310px; 
            z-index: 10; 
            box-sizing: border-box;
        }

        .cell-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .grid input { 
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 4px;
            background-color: rgba(90, 35, 35, 0.5); 
            
            color: #ffffff; 
            text-shadow: 2px 2px 3px black, -1px -1px 2px black; 
            
            background-size: 70% 70%; 
            background-repeat: no-repeat;
            background-position: center left 15%; 
            padding-right: 25px; 
            box-sizing: border-box;
            
            -moz-appearance: textfield; 
        }
        
        .grid input::-webkit-inner-spin-button, 
        .grid input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .grid input:focus { 
            outline: 2px solid #ffcc00; 
            background-color: rgba(40, 10, 10, 0.9); 
            z-index: 1; 
        }
        
        .custom-spinner {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 25px; 
            display: flex;
            flex-direction: column;
            z-index: 2; 
        }

        .custom-spinner div {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px; 
            background-color: rgba(0, 0, 0, 0.25); 
            cursor: pointer;
            user-select: none; 
        }

        .custom-spinner div:first-child {
            border-radius: 0 4px 0 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-spinner div:last-child {
            border-radius: 0 0 4px 0;
        }

        .custom-spinner div:active {
            background-color: rgba(255, 204, 0, 0.8);
            color: #000;
        }
        
        .controls {
            margin-top: auto; 
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        /* 👉 新增：十字方向鍵 UI 樣式 */
        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .d-pad button {
            padding: 0;
            margin: 0;
            font-size: 20px;
            background-color: #4c2222;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .d-pad button:active {
            background-color: #ffcc00;
            color: black;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        
        /* 將原本的按鈕獨立命名，避免被方向鍵吃掉樣式 */
        .ai-btn { 
            padding: 12px 30px; 
            font-size: 20px; 
            cursor: pointer; 
            background-color: #d15a5a; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 25px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px; 
        }
        
        .ai-btn:hover { 
            background-color: #b04848; 
        }
        
        #result { 
            margin-top: 10px; 
            font-size: 26px; 
            font-weight: bold; 
            color: #fff; 
            text-shadow: 2px 2px 4px #000; 
            background-color: rgba(43, 37, 55, 0.95); 
            padding: 10px 30px; 
            border-radius: 25px; 
            border: 2px solid #ffcc00; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.6); 
        }

        #result:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        
        <div class="custom-title">2048 AI - 魔幻飲料店專用</div>

        <div class="grid" id="board">
            <script>
                function updateImage(inputElement) {
                    let val = parseInt(inputElement.value) || 0;
                    if (val >= 1 && val <= 11) {
                        inputElement.style.backgroundImage = `url('images/${val}.png')`;
                    } else {
                        inputElement.style.backgroundImage = "none";
                    }
                }

                function changeValue(index, delta) {
                    let input = document.getElementById(`cell-${index}`);
                    let currentVal = parseInt(input.value) || 0;
                    let newVal = currentVal + delta;
                    
                    if (newVal >= 0 && newVal <= 11) {
                        input.value = newVal;
                        updateImage(input);
                    }
                }

                for(let i=0; i<16; i++) {
                    document.write(`
                    <div class="cell-wrapper">
                        <input type="number" id="cell-${i}" value="0" min="0" max="11" step="1" oninput="updateImage(this)">
                        <div class="custom-spinner">
                            <div onclick="changeValue(${i}, 1)">▲</div>
                            <div onclick="changeValue(${i}, -1)">▼</div>
                        </div>
                    </div>
                    `);
                }
            </script>
        </div>

        <div class="controls">
            <!-- 👉 新增：畫面上的十字方向鍵 -->
            <div class="d-pad">
                <button class="btn-up" onclick="moveBoard('up')">⬆️</button>
                <button class="btn-left" onclick="moveBoard('left')">⬅️</button>
                <button class="btn-down" onclick="moveBoard('down')">⬇️</button>
                <button class="btn-right" onclick="moveBoard('right')">➡️</button>
            </div>

            <button class="ai-btn" onclick="askAI()">請求 AI 最佳解</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        // 👉 新增：擷取盤面陣列
        function getBoard() {
            let board = [];
            for (let r = 0; r < 4; r++) {
                let row = [];
                for (let c = 0; c < 4; c++) {
                    row.push(parseInt(document.getElementById(`cell-${r*4+c}`).value) || 0);
                }
                board.push(row);
            }
            return board;
        }

        // 👉 新增：更新盤面陣列回畫面
        function setBoard(board) {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    let el = document.getElementById(`cell-${r*4+c}`);
                    el.value = board[r][c];
                    updateImage(el);
                }
            }
        }

        // 👉 新增：2048 滑動與合成邏輯 (遵守 11 不能合成的規則)
        function slideAndMerge(line) {
            let arr = line.filter(val => val > 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i+1] && arr[i] < 11) {
                    arr[i]++;
                    arr.splice(i+1, 1);
                }
            }
            while (arr.length < 4) {
                arr.push(0);
            }
            return arr;
        }

        // 👉 新增：控制盤面方向滑動
        function moveBoard(direction) {
            let board = getBoard();
            
            if (direction === 'left' || direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    let row = board[r];
                    if (direction === 'right') row.reverse();
                    row = slideAndMerge(row);
                    if (direction === 'right') row.reverse();
                    board[r] = row;
                }
            } else if (direction === 'up' || direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    if (direction === 'down') col.reverse();
                    col = slideAndMerge(col);
                    if (direction === 'down') col.reverse();
                    for (let r = 0; r < 4; r++) {
                        board[r][c] = col[r];
                    }
                }
            }
            setBoard(board);
        }

        // 👉 新增：實體鍵盤的上下左右監聽器
        document.addEventListener('keydown', function(e) {
            // 如果點進輸入框正在打字，就不觸發全域快捷鍵
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { moveBoard('up'); e.preventDefault(); }
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { moveBoard('down'); e.preventDefault(); }
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { moveBoard('left'); e.preventDefault(); }
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { moveBoard('right'); e.preventDefault(); }
        });

        async function askAI() {
            document.getElementById("result").innerText = "計算中...";
            
            // 這裡改成共用 getBoard()，讓程式碼更簡潔
            let boardArray = getBoard();
            let realBoard = boardArray.map(row => 
                row.map(power => (power === 0) ? 0 : Math.pow(2, power))
            );

            try {
                const response = await fetch("/api/get_best_move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ board: realBoard })
                });
                
                const data = await response.json();
                if(data.error) {
                    document.getElementById("result").innerText = "錯誤: " + data.error;
                } else {
                    document.getElementById("result").innerText = "👉 " + data.best_move;
                }
            } catch (error) {
                document.getElementById("result").innerText = "連線失敗";
            }
        }
    </script>
</body>
</html>
