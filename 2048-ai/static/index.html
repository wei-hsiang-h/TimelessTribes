<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 AI 專屬輔助</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            background-color: #222; 
        }
        
        .phone-screen {
            position: relative;
            width: 100vw;
            max-width: 450px; 
            height: 100vh;
            min-height: 850px;
            background-image: url('image_2.png'); /* 使用去掉瀏海的新圖片 */
            background-size: cover;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 2px; 
            width: 88%; 
            background-color: transparent; 
            
            /* 調整向上移動對齊新圖片的框框 */
            margin-top: 260px; 
        }

        .grid input { 
            aspect-ratio: 1 / 1; 
            width: 100%;
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            border: none; 
            background-color: rgba(255, 255, 255, 0.15); /* 稍微調白一點點方便你對齊位置，對齊好可改為 transparent */
            color: #fff; 
            text-shadow: 1px 1px 2px black; 
            background-size: cover; 
            background-position: center;
        }
        .grid input:focus { outline: 2px solid #ffcc00; background-color: rgba(0,0,0,0.5); }
        
        .controls {
            margin-top: auto; 
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        button { 
            padding: 12px 30px; 
            font-size: 20px; 
            cursor: pointer; 
            background-color: #d15a5a; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 25px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #b04848; }
        #result { margin-top: 15px; font-size: 28px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>
    <div class="phone-screen">
        <div class="grid" id="board">
            <script>
                function updateImage(inputElement) {
                    let val = inputElement.value;
                    if (val > 0) {
                        inputElement.style.backgroundImage = `url('images/${val}.png')`;
                        inputElement.style.color = "transparent"; 
                    } else {
                        inputElement.style.backgroundImage = "none";
                        inputElement.style.color = "#fff"; 
                    }
                }

                for(let i=0; i<16; i++) {
                    document.write(`<input type="number" id="cell-${i}" value="0" min="0" max="11" step="1" oninput="updateImage(this)">`);
                }
            </script>
        </div>

        <div class="controls">
            <button onclick="askAI()">請求 AI 最佳解</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        async function askAI() {
            document.getElementById("result").innerText = "計算中...";
            
            let boardArray = [];
            for (let r = 0; r < 4; r++) {
                let row = [];
                for (let c = 0; c < 4; c++) {
                    let power = parseInt(document.getElementById(`cell-${r*4+c}`).value) || 0;
                    let realValue = (power === 0) ? 0 : Math.pow(2, power);
                    row.push(realValue);
                }
                boardArray.push(row);
            }

            try {
                const response = await fetch("/api/get_best_move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ board: boardArray })
                });
                
                const data = await response.json();
                if(data.error) {
                    document.getElementById("result").innerText = "錯誤: " + data.error;
                } else {
                    document.getElementById("result").innerText = "👉 " + data.best_move;
                }
            } catch (error) {
                document.getElementById("result").innerText = "連線失敗";
            }
        }
    </script>
</body>
</html>
