<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 AI - 魔幻飲料店專用</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            background-color: #222; 
        }
        
        .phone-screen {
            position: relative;
            width: 100vw;
            max-width: 450px; 
            height: 100vh;
            min-height: 850px;
            background-image: url('image_2.png');
            background-size: cover;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 專屬標題 */
        .custom-title {
            position: absolute;
            top: 125px;     
            right: 0px;     
            width: 280px;   
            height: 50px;   
            background-color: #2b2537; 
            color: #ffe6a0; 
            font-size: 22px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px 0 0 8px; 
            z-index: 20;
            letter-spacing: 1px;
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.5); 
        }

        /* 遮住網格背後原本文字的區塊與大外框底色 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 2px; 
            width: 86%; 
            background-color: #4c2222; 
            padding: 4px; 
            border-radius: 6px; 
            margin-top: 310px; 
            z-index: 10; 
            box-sizing: border-box;
        }

        .grid input { 
            aspect-ratio: 1 / 1; 
            width: 100%;
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 4px;
            background-color: rgba(90, 35, 35, 0.5); 
            
            color: #ffffff; 
            text-shadow: 2px 2px 3px black, -1px -1px 2px black; 
            
            background-size: 70% 70%; 
            background-repeat: no-repeat;
            background-position: center left 15%; 
            padding-right: 15px; 
            box-sizing: border-box;
        }
        
        .grid input:focus { 
            outline: 2px solid #ffcc00; 
            background-color: rgba(40, 10, 10, 0.9); 
        }
        
        /* 保留上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            opacity: 1; 
            height: 30px;
            cursor: pointer;
        }
        
        .controls {
            margin-top: auto; 
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }
        
        button { 
            padding: 12px 30px; 
            font-size: 20px; 
            cursor: pointer; 
            background-color: #d15a5a; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 25px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px; /* 跟下方的結果框拉開一點距離 */
        }
        
        button:hover { 
            background-color: #b04848; 
        }
        
        /* 👉 幫 AI 結果加上深色底框，讓字體超清晰 */
        #result { 
            margin-top: 10px; 
            font-size: 26px; 
            font-weight: bold; 
            color: #fff; 
            text-shadow: 2px 2px 4px #000; 
            background-color: rgba(43, 37, 55, 0.95); /* 深紫色半透明底，跟標題呼應 */
            padding: 10px 30px; /* 增加內邊距讓框變大 */
            border-radius: 25px; /* 圓角藥丸形狀 */
            border: 2px solid #ffcc00; /* 加上金色邊框看起來更像遊戲提示 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.6); /* 立體陰影 */
        }

        /* 當沒有文字內容時，自動隱藏底框 */
        #result:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        
        <div class="custom-title">2048 AI - 魔幻飲料店專用</div>

        <div class="grid" id="board">
            <script>
                function updateImage(inputElement) {
                    let val = parseInt(inputElement.value) || 0;
                    if (val >= 1 && val <= 11) {
                        inputElement.style.backgroundImage = `url('images/${val}.png')`;
                    } else {
                        inputElement.style.backgroundImage = "none";
                    }
                }

                for(let i=0; i<16; i++) {
                    document.write(`<input type="number" id="cell-${i}" value="0" min="0" max="11" step="1" oninput="updateImage(this)">`);
                }
            </script>
        </div>

        <div class="controls">
            <button onclick="askAI()">請求 AI 最佳解</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        async function askAI() {
            document.getElementById("result").innerText = "計算中...";
            
            let boardArray = [];
            for (let r = 0; r < 4; r++) {
                let row = [];
                for (let c = 0; c < 4; c++) {
                    let power = parseInt(document.getElementById(`cell-${r*4+c}`).value) || 0;
                    let realValue = (power === 0) ? 0 : Math.pow(2, power);
                    row.push(realValue);
                }
                boardArray.push(row);
            }

            try {
                const response = await fetch("/api/get_best_move", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ board: boardArray })
                });
                
                const data = await response.json();
                if(data.error) {
                    document.getElementById("result").innerText = "錯誤: " + data.error;
                } else {
                    document.getElementById("result").innerText = "👉 " + data.best_move;
                }
            } catch (error) {
                document.getElementById("result").innerText = "連線失敗";
            }
        }
    </script>
</body>
</html>
